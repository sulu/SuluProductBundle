sulu_product.get_products:
    path: /products.{_format}
    methods: GET
    controller: sulu_product.admin_product_details_controller::cgetAction
    format: json

sulu_product.get_product:
    path: /products/{id}.{_format}
    methods: GET
    controller: sulu_product.admin_product_details_controller::getAction
    format: json

sulu_product.post_product:
