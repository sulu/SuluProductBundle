name: Test application

on:
    pull_request:
    push:
        branches:
            - '[0-9]+.x'
            - '[0-9]+.[0-9]+'
    workflow_dispatch:

env:
    CI_GROUP_OUTPUT: true

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    php:
        name: "PHP ${{ matrix.php-version }} (${{ matrix.database }}, ${{ matrix.dependency-versions }})"
        runs-on: ubuntu-22.04
        timeout-minutes: 30

        env:
            APP_ENV: test
            APP_SECRET: a448d1dfcaa563fce56c2fd9981f662b
            MAILER_URL: null://localhost
            SULU_ADMIN_EMAIL:
            # Composer reads COMPOSER_AUTH, not COMPOSER_TOKEN; the vcs repository in
            # composer.json enumerates refs over the GitHub API and is rate-limited without it.
            COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

        strategy:
            fail-fast: false
            matrix:
                include:
                    - php-version: '8.2'
                      database: mysql-57
                      dependency-versions: 'lowest'
                      php-extensions: 'ctype, iconv, mysql, gd'
                      tools: 'composer:v2'
                      env:
                          SYMFONY_DEPRECATIONS_HELPER: disabled
                          DATABASE_URL: mysql://root@127.0.0.1:3306/sulu_test?serverVersion=5.7&charset=utf8mb4

                    - php-version: '8.3'
                      database: mysql-80
                      dependency-versions: 'highest'
                      php-extensions: 'ctype, iconv, mysql, gd'
                      tools: 'composer:v2'
                      env:
                          SYMFONY_DEPRECATIONS_HELPER: weak
                          DATABASE_URL: mysql://root:ChangeMe@127.0.0.1:3306/sulu_test?serverVersion=8.0&charset=utf8mb4

                    - php-version: '8.4'
                      database: mysql-80
                      dependency-versions: 'highest'
                      php-extensions: 'ctype, iconv, mysql, gd'
                      tools: 'composer:v2'
                      env:
                          SYMFONY_DEPRECATIONS_HELPER: weak
                          DATABASE_URL: mysql://root:ChangeMe@127.0.0.1:3306/sulu_test?serverVersion=8.0&charset=utf8mb4

                    - php-version: '8.5'
                      database: mysql-84
                      dependency-versions: 'highest'
                      php-extensions: 'ctype, iconv, mysql, gd'
                      tools: 'composer:snapshot'
                      composer-stability: 'dev'
                      env:
                          SYMFONY_DEPRECATIONS_HELPER: weak
                          DATABASE_URL: mysql://root:ChangeMe@127.0.0.1:3306/sulu_test?serverVersion=8.4&charset=utf8mb4

        steps:
            - name: Checkout project
              uses: actions/checkout@v4

            - name: Start Database
              run: docker compose -f tests/docker/docker-compose.${{ matrix.database }}.yml up --wait

            - name: Install and configure PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  extensions: ${{ matrix.php-extensions }}
                  tools: ${{ matrix.tools }}
                  ini-values: memory_limit=-1
                  coverage: none

            - name: Remove Lint Tools
              # These tools are not required to run tests, so we are removing them to improve dependency resolving and
              # testing lowest versions.
              run: composer remove "*php-cs-fixer*" "*phpstan*" "*rector*" --dev --no-update

            - name: Set composer stability
              if: ${{ matrix.composer-stability }}
              run: composer config minimum-stability ${{ matrix.composer-stability }}

            - name: Install composer dependencies
              uses: ramsey/composer-install@v3
              with:
                  dependency-versions: ${{ matrix.dependency-versions }}

            - name: Bootstrap test environment
              run: composer bootstrap-test-environment
              env: ${{ matrix.env }}

            - name: Execute test cases
              run: composer test
              env: ${{ matrix.env }}

    php-lint:
        name: "PHP Lint"
        runs-on: ubuntu-22.04
        timeout-minutes: 30

        env:
            APP_ENV: test
            APP_SECRET: a448d1dfcaa563fce56c2fd9981f662b
            MAILER_URL: null://localhost
            SULU_ADMIN_EMAIL:
            # Composer reads COMPOSER_AUTH, not COMPOSER_TOKEN; the vcs repository in
            # composer.json enumerates refs over the GitHub API and is rate-limited without it.
            COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

        steps:
            - name: Checkout project
              uses: actions/checkout@v4

            - name: Install and configure PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  extensions: 'ctype, iconv, mysql'
                  tools: 'composer:v2'
                  ini-values: memory_limit=-1
                  coverage: none

            - name: Install composer dependencies
              uses: ramsey/composer-install@v3
              with:
                  dependency-versions: highest

            - name: Output versions and installed dependencies
              run: |
                  echo 'PHP Version:'
                  php --version
                  echo ''
                  echo 'PHP Modules:'
                  php -m
                  echo ''
                  echo 'Composer Info:'
                  composer info
                  echo ''
                  echo 'Composer Lock:'
                  cat composer.lock

            - name: Lint code
              run: composer lint

    php-coverage:
        name: "PHP Coverage"
        runs-on: ubuntu-22.04
        timeout-minutes: 30

        env:
            APP_ENV: test
            APP_SECRET: a448d1dfcaa563fce56c2fd9981f662b
            MAILER_URL: null://localhost
            SULU_ADMIN_EMAIL:
            # Composer reads COMPOSER_AUTH, not COMPOSER_TOKEN; the vcs repository in
            # composer.json enumerates refs over the GitHub API and is rate-limited without it.
            COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
            SYMFONY_DEPRECATIONS_HELPER: weak
            DATABASE_URL: mysql://root:ChangeMe@127.0.0.1:3306/sulu_test?serverVersion=8.0&charset=utf8mb4

        steps:
            - name: Checkout project
              uses: actions/checkout@v4

            - name: Start Database
              run: docker compose -f tests/docker/docker-compose.mysql-80.yml up --wait

            - name: Install and configure PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  extensions: 'ctype, iconv, mysql, gd, pcov'
                  tools: 'composer:v2'
                  ini-values: memory_limit=-1
                  coverage: pcov

            - name: Install composer dependencies
              uses: ramsey/composer-install@v3
              with:
                  dependency-versions: highest

            - name: Bootstrap test environment
              run: composer bootstrap-test-environment

            - name: Execute tests with coverage
              run: composer test-with-coverage

            - name: Check coverage
              run: composer check-coverage

            - name: Upload coverage report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: code-coverage-report
                  path: tests/reports/html
                  retention-days: 7

            - name: Publish test results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: test-results
                  path: tests/reports/junit.xml
                  retention-days: 7
