framework:
    workflows: null
    profiler:
        collect: false
    messenger:
        transports:
            sync: 'sync://'
        routing:

twig:
    paths:
        - '%kernel.project_dir%/templates'

sulu_admin:
    forms:
        directories:
            - '%kernel.project_dir%/config/forms'

sulu_product:
    default_main_webspace: 'sulu-io'
    association_types:
        alternative: ~
        suitable: ~
    search:
        website:
            additional_product_filters: true

# The default request workflow covers only the listed resources.
sulu_content:
    request_workflows:
        default:
            resources: ['products']
