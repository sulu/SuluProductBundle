version: '3'
services:
  database:
    image: postgres:16
    command: [ "postgres", "-c", "max_connections=1000" ]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: 'sulu_test'
      POSTGRES_USER: 'postgres'
      POSTGRES_PASSWORD: 'ChangeMe'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d sulu_test" ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - sulu-postgres16-data:/var/lib/postgresql/data

volumes:
  sulu-postgres16-data:
